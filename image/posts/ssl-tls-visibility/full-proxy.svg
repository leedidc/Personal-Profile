<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="760"
  viewBox="0 0 640 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">두 개의 TLS 연결로 동작하는 Full Proxy</title>
  <desc id="desc">
    클라이언트와 프록시의 TLS A, 프록시와 서버의 TLS B는 서로 다른 트래픽 키를 사용한다. 프록시
    내부에서 복호화, 검사, 재암호화가 이루어진다.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path d="M1 1L9 5L1 9" fill="none" stroke="#187e88" stroke-width="2" />
    </marker>
  </defs>
  <rect width="640" height="760" rx="20" fill="#f0f6f8" />
  <g font-family="Malgun Gothic, sans-serif" fill="#152a3d" text-anchor="middle">
    <text x="320" y="52" font-size="28" font-weight="700">TLS 연결은 두 구간으로 나뉜다</text>
    <text x="320" y="88" font-size="22" fill="#486473">Full Proxy · 요청 방향의 처리 예시</text>
    <rect
      x="155"
      y="124"
      width="330"
      height="92"
      rx="14"
      fill="#fff"
      stroke="#b2d4d7"
      stroke-width="2"
    />
    <text x="320" y="163" font-size="27" font-weight="700">클라이언트</text>
    <text x="320" y="195" font-size="22" fill="#486473">프록시가 제시한 인증서 검증</text>
    <path d="M320 224V293" fill="none" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <text x="207" y="264" font-size="24" fill="#187e88">TLS A</text>
    <text x="453" y="264" font-size="23">A의 트래픽 키</text>
    <rect x="70" y="312" width="500" height="158" rx="16" fill="#152a3d" />
    <text x="320" y="354" font-size="28" fill="#fff" font-weight="700">TLS 프록시</text>
    <text x="320" y="397" font-size="26" fill="#8dd8dd">복호화 → 검사 → 재암호화</text>
    <text x="320" y="438" font-size="23" fill="#d1e0e9">양쪽 연결의 종단점 · 내부 평문 처리</text>
    <path d="M320 480V549" fill="none" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <text x="207" y="520" font-size="24" fill="#187e88">TLS B</text>
    <text x="453" y="520" font-size="23">B의 트래픽 키</text>
    <rect
      x="155"
      y="568"
      width="330"
      height="92"
      rx="14"
      fill="#fff"
      stroke="#b2d4d7"
      stroke-width="2"
    />
    <text x="320" y="607" font-size="27" font-weight="700">외부 서버</text>
    <text x="320" y="639" font-size="22" fill="#486473">프록시와 별도 TLS 연결 수립</text>
    <text x="320" y="714" font-size="24" font-weight="700" fill="#187e88">
      TLS A의 키 ≠ TLS B의 키
    </text>
  </g>
</svg>
