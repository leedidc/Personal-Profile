<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="920"
  viewBox="0 0 640 920"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">암호화 패킷이 보안 검사 데이터로 바뀌는 과정</title>
  <desc id="desc">
    TCP 스트림 재조립, TLS 복호화와 인증 태그 검증, HTTP 해석, 파일과 본문 추출, IPS와 DLP 검사를
    거친다. 허용한 데이터만 서버 측 TLS 연결로 다시 암호화하며 차단 결과는 전달하지 않는다.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" fill="none" stroke="#187e88" stroke-width="2" />
    </marker>
  </defs>
  <rect width="640" height="920" rx="20" fill="#f0f6f8" />
  <g font-family="Malgun Gothic, sans-serif" fill="#152a3d" text-anchor="middle">
    <text x="320" y="51" font-size="28" font-weight="700">복호화 다음에 보안 검사가 있다</text>
    <text x="320" y="87" font-size="22" fill="#486473">TCP 기반 HTTPS · 인라인 검사 예시</text>
    <g fill="#fff" stroke="#b2d4d7" stroke-width="2">
      <rect x="65" y="122" width="510" height="88" rx="12" />
      <rect x="65" y="252" width="510" height="88" rx="12" />
      <rect x="65" y="382" width="510" height="88" rx="12" />
      <rect x="65" y="512" width="510" height="88" rx="12" />
    </g>
    <g font-size="26" font-weight="700">
      <text x="320" y="158">01 · TCP 스트림 재조립</text>
      <text x="320" y="288">02 · TLS 레코드 복호화</text>
      <text x="320" y="418">03 · HTTP 메시지 해석</text>
      <text x="320" y="548">04 · 콘텐츠 추출</text>
    </g>
    <g font-size="22" fill="#486473">
      <text x="320" y="192">패킷을 순서에 맞는 바이트 스트림으로 복원</text>
      <text x="320" y="322">트래픽 키 사용 · AEAD 인증 태그 검증</text>
      <text x="320" y="452">HTTP/2는 프레임·스트림·헤더 압축 처리</text>
      <text x="320" y="582">URL · 본문 · 파일 · 압축 해제</text>
    </g>
    <g stroke="#187e88" stroke-width="3" marker-end="url(#arrow)">
      <path d="M320 214V244" />
      <path d="M320 344V374" />
      <path d="M320 474V504" />
      <path d="M320 604V634" />
    </g>
    <rect x="65" y="642" width="510" height="90" rx="12" fill="#152a3d" />
    <text x="320" y="679" font-size="27" font-weight="700" fill="#fff">05 · 보안 정책 판단</text>
    <text x="320" y="713" font-size="23" fill="#8dd8dd">IPS · DLP · 악성코드 검사</text>
    <path d="M220 736V790" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M478 736V790" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="65" y="802" width="295" height="78" rx="12" fill="#dceff0" />
    <rect x="382" y="802" width="193" height="78" rx="12" fill="#f2e9e4" />
    <text x="212" y="835" font-size="24" font-weight="700" fill="#12616a">허용</text>
    <text x="212" y="866" font-size="22" fill="#12616a">재암호화 후 전달</text>
    <text x="478" y="835" font-size="24" font-weight="700" fill="#87563e">차단</text>
    <text x="478" y="866" font-size="22" fill="#87563e">전달 중단</text>
  </g>
</svg>
