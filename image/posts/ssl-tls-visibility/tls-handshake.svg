<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="800"
  viewBox="0 0 640 800"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">TLS 1.3의 대표적인 인증서 기반 핸드셰이크</title>
  <desc id="desc">
    ClientHello와 ServerHello로 키 교환 정보를 주고받은 뒤 핸드셰이크 키를 도출한다. 이후 인증서와
    Finished 등 핸드셰이크 메시지는 암호화된다. 마지막으로 애플리케이션 데이터를 주고받는다.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="9"
      markerHeight="9"
      refX="8"
      refY="4.5"
      orient="auto-start-reverse"
    >
      <path d="M1 1L8 4.5L1 8" fill="none" stroke="#187e88" stroke-width="2" />
    </marker>
  </defs>
  <rect width="640" height="800" rx="20" fill="#f0f6f8" />
  <g font-family="Malgun Gothic, sans-serif" fill="#152a3d" text-anchor="middle">
    <text x="320" y="50" font-size="28" font-weight="700">TLS 1.3 핸드셰이크</text>
    <text x="320" y="84" font-size="22" fill="#486473">인증서 기반 서버 인증 + ECDHE 예시</text>
    <rect x="45" y="116" width="170" height="52" rx="10" fill="#152a3d" />
    <rect x="425" y="116" width="170" height="52" rx="10" fill="#152a3d" />
    <text x="130" y="151" font-size="24" fill="#fff">클라이언트</text>
    <text x="510" y="151" font-size="24" fill="#fff">서버</text>
    <path d="M130 178V738M510 178V738" stroke="#b2c8d2" stroke-width="2" stroke-dasharray="7 7" />
    <text x="320" y="212" font-size="24">ClientHello · key_share</text>
    <path d="M136 230H504" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <text x="320" y="270" font-size="24">ServerHello · key_share</text>
    <path d="M504 288H136" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="65" y="315" width="510" height="49" rx="9" fill="#dceff0" />
    <text x="320" y="348" font-size="23" fill="#12616a">공유 비밀값 → 핸드셰이크 키 도출</text>
    <rect
      x="65"
      y="384"
      width="510"
      height="253"
      rx="12"
      fill="#fff"
      stroke="#b2d4d7"
      stroke-width="2"
    />
    <text x="320" y="421" font-size="23" fill="#12616a" font-weight="700">
      이후 핸드셰이크 메시지는 암호화
    </text>
    <text x="320" y="461" font-size="23">EncryptedExtensions</text>
    <text x="320" y="495" font-size="23">Certificate · CertificateVerify</text>
    <text x="320" y="529" font-size="23">Finished</text>
    <path d="M504 548H136" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <text x="320" y="585" font-size="23">클라이언트 검증 후 Finished</text>
    <path d="M136 605H504" stroke="#187e88" stroke-width="3" marker-end="url(#arrow)" />
    <text x="320" y="682" font-size="25" font-weight="700">Application Data</text>
    <path
      d="M138 704H502"
      stroke="#187e88"
      stroke-width="3"
      marker-start="url(#arrow)"
      marker-end="url(#arrow)"
    />
    <text x="320" y="764" font-size="22" fill="#486473">
      용도와 송수신 방향에 따라 키를 구분한다
    </text>
  </g>
</svg>
