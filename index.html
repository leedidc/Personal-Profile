<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="이찬형의 학력, 교육 이수현황, 경력, 자격, 어학, 프로젝트, 대외활동, 수상 포트폴리오"
    />
    <meta name="theme-color" content="#152a3d" />
    <title>이찬형 | 포트폴리오</title>
    <link rel="icon" href="image/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/site-common.css" />
    <link rel="stylesheet" href="css/award-research.css" />
    <link rel="stylesheet" href="css/ai-chatbot.css" />
    <link rel="stylesheet" href="css/portfolio-skills.css" />
    <link rel="stylesheet" href="css/portfolio-effects.css" />
    <script src="js/portfolio-config.js" defer></script>
    <script src="js/portfolio-core.js" defer></script>
    <script src="js/portfolio-skills.js" defer></script>
    <script src="js/award-research.js" defer></script>
    <script src="js/ai-chatbot-service.js" defer></script>
    <script src="js/ai-chatbot.js" defer></script>
    <script src="js/portfolio-effects.js" defer></script>
    <script src="js/portfolio.js" defer></script>
  </head>
  <body class="portfolio-page">
    <a class="skip-link" href="#main">본문으로 이동</a>
    <header class="site-header portfolio-header">
      <div class="reading-progress" aria-hidden="true"><span id="reading-progress"></span></div>
      <div class="header-inner">
        <a class="brand" href="#main"
          ><span class="brand-mark" aria-hidden="true">CL</span><span>이찬형</span></a
        >
        <nav aria-label="주요 메뉴">
          <a href="#education">학력</a>
          <a href="#training">교육 이수현황</a>
          <a href="#experience">경력</a>
          <a href="#certifications">자격</a>
          <a href="#languages">어학</a>
          <a href="#skills">SKILL</a>
          <a href="#projects">프로젝트</a>
          <a href="#activities">대외활동</a>
          <a href="#awards">수상</a>
          <a href="posts/">글</a>
        </nav>
        <a
          class="header-github"
          href="https://github.com/leedidc"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <main id="main" class="page-width">
      <div id="profile"></div>
      <div id="portfolio"><p class="load-message" role="status">불러오는 중…</p></div>
      <noscript><p>포트폴리오를 보려면 JavaScript를 켜 주세요.</p></noscript>
    </main>
    <footer class="site-footer page-width"><span>이찬형</span><a href="#main">맨 위로 ↑</a></footer>
    <template id="network-visual-template">
      <div class="network-visual">
        <div class="network-caption">SECURITY</div>
        <svg class="network-art" viewBox="0 0 360 240" aria-hidden="true" focusable="false">
          <g class="network-grid">
            <path
              d="M60 0V240M120 0V240M180 0V240M240 0V240M300 0V240M0 60H360M0 120H360M0 180H360"
            />
          </g>
          <circle class="network-orbit" cx="180" cy="120" r="88" />
          <circle class="network-orbit network-orbit-inner" cx="180" cy="120" r="64" />
          <g class="network-radar">
            <path class="network-radar-trail" d="M180 120V32A88 88 0 0 1 242.23 57.77Z" />
            <path class="network-radar-beam" d="M180 120L242.23 57.77" />
          </g>
          <g class="network-connections">
            <path
              d="M36 62H104L180 120M38 174H102L180 120M180 22V120M324 62H256L180 120M322 174H258L180 120M180 218V120"
            />
          </g>
          <g class="network-packets">
            <path pathLength="100" d="M36 62H104L180 120" />
            <path pathLength="100" d="M38 174H102L180 120" />
            <path pathLength="100" d="M180 22V120" />
            <path pathLength="100" d="M324 62H256L180 120" />
            <path pathLength="100" d="M322 174H258L180 120" />
            <path pathLength="100" d="M180 218V120" />
          </g>
          <g class="network-nodes">
            <circle cx="36" cy="62" r="5" />
            <circle cx="38" cy="174" r="5" />
            <circle cx="180" cy="22" r="5" />
            <circle cx="324" cy="62" r="5" />
            <circle cx="322" cy="174" r="5" />
            <circle cx="180" cy="218" r="5" />
          </g>
          <circle class="network-halo" cx="180" cy="120" r="42" />
          <g class="network-shield">
            <path d="M180 86L207 97V118C207 137 193 150 180 156C167 150 153 137 153 118V97Z" />
            <path class="network-check" d="M168 119L177 128L194 109" />
          </g>
        </svg>
      </div>
    </template>
    <button
      id="ai-chat-launcher"
      class="ai-chat-launcher"
      type="button"
      aria-controls="ai-chat-panel"
      aria-expanded="false"
      aria-haspopup="dialog"
      hidden
    >
      <span aria-hidden="true">AI</span><span>포트폴리오에 대해 질문</span>
    </button>
    <dialog
      id="ai-chat-panel"
      class="ai-chat-panel"
      aria-labelledby="ai-chat-title"
      aria-describedby="ai-chat-description"
    >
      <header class="ai-chat-heading">
        <div>
          <h2 id="ai-chat-title">포트폴리오 AI</h2>
          <p id="ai-chat-description">경력과 연구를 물어보세요.</p>
        </div>
        <div class="ai-chat-actions">
          <button
            id="ai-chat-reset"
            class="button small"
            type="button"
            title="이 화면의 대화 지우기"
          >
            새 대화
          </button>
          <button id="ai-chat-close" class="button icon" type="button" aria-label="챗봇 닫기">
            ×
          </button>
        </div>
      </header>
      <ol
        id="ai-chat-messages"
        class="ai-chat-messages"
        role="log"
        aria-label="AI와의 대화"
        aria-live="polite"
        aria-relevant="additions text"
      ></ol>
      <div id="ai-chat-suggestions" class="ai-chat-suggestions" aria-label="추천 질문">
        <button type="button" data-question="어떤 일을 하고 있나요?">현재 하는 일</button>
        <button type="button" data-question="보유한 자격증을 알려주세요.">보유 자격증</button>
        <button type="button" data-question="연구와 수상 내용을 소개해 주세요.">연구와 수상</button>
        <button type="button" data-question="주요 프로젝트를 소개해 주세요.">주요 프로젝트</button>
      </div>
      <p id="ai-chat-status" class="ai-chat-status" role="status"></p>
      <form id="ai-chat-form" class="ai-chat-form">
        <label class="sr-only" for="ai-chat-input">질문 (최대 1,000자)</label>
        <textarea
          id="ai-chat-input"
          rows="2"
          maxlength="1000"
          placeholder="경력이나 연구에 대해 물어보세요"
          enterkeyhint="send"
        ></textarea>
        <button id="ai-chat-send" class="button primary" type="submit" disabled>보내기</button>
      </form>
      <p class="ai-chat-reference">
        AI 답변은 본문과 함께 확인해 주세요. <a href="#experience">경력</a> ·
        <a href="#certifications">자격</a> · <a href="#awards">수상</a>
      </p>
      <p class="ai-chat-notice">
        질문과 공개 이력은 답변 생성을 위해 AI 서비스에 전달됩니다. 대화는 이 창을 새로고침하면
        초기화됩니다.
      </p>
    </dialog>
  </body>
</html>
