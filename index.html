<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="이찬형의 학력, 경력, 자격, 어학, 프로젝트, 대외활동, 수상 포트폴리오"
    />
    <meta name="theme-color" content="#152a3d" />
    <title>이찬형 | 포트폴리오</title>
    <link rel="icon" href="image/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/site-common.css" />
    <link rel="stylesheet" href="css/award-research.css" />
    <link rel="stylesheet" href="css/ai-chatbot.css" />
    <script src="js/portfolio-config.js" defer></script>
    <script src="js/portfolio-core.js" defer></script>
    <script src="js/award-research.js" defer></script>
    <script src="js/ai-chatbot-service.js" defer></script>
    <script src="js/ai-chatbot.js" defer></script>
    <script src="js/portfolio.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#main"
          ><span class="brand-mark" aria-hidden="true">CL</span><span>이찬형</span></a
        >
        <nav aria-label="주요 메뉴">
          <a href="#education">학력</a>
          <a href="#experience">경력</a>
          <a href="#certifications">자격</a>
          <a href="#languages">어학</a>
          <a href="#projects">프로젝트</a>
          <a href="#activities">대외활동</a>
          <a href="#awards">수상</a>
          <a href="posts/">글</a>
        </nav>
        <a
          class="header-github"
          href="https://github.com/leedidc"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <main id="main" class="page-width">
      <div id="profile"></div>
      <div id="portfolio"><p class="load-message" role="status">불러오는 중…</p></div>
      <noscript><p>포트폴리오를 보려면 JavaScript를 켜 주세요.</p></noscript>
    </main>
    <footer class="site-footer page-width"><span>이찬형</span><a href="#main">맨 위로 ↑</a></footer>
    <button
      id="ai-chat-launcher"
      class="ai-chat-launcher"
      type="button"
      aria-controls="ai-chat-panel"
      aria-expanded="false"
      aria-haspopup="dialog"
      hidden
    >
      <span aria-hidden="true">AI</span><span>포트폴리오에 대해 질문</span>
    </button>
    <dialog
      id="ai-chat-panel"
      class="ai-chat-panel"
      aria-labelledby="ai-chat-title"
      aria-describedby="ai-chat-description"
    >
      <header class="ai-chat-heading">
        <div>
          <h2 id="ai-chat-title">포트폴리오 AI</h2>
          <p id="ai-chat-description">경력과 연구를 물어보세요.</p>
        </div>
        <div class="ai-chat-actions">
          <button
            id="ai-chat-reset"
            class="button small"
            type="button"
            title="이 화면의 대화 지우기"
          >
            새 대화
          </button>
          <button id="ai-chat-close" class="button icon" type="button" aria-label="챗봇 닫기">
            ×
          </button>
        </div>
      </header>
      <ol
        id="ai-chat-messages"
        class="ai-chat-messages"
        role="log"
        aria-label="AI와의 대화"
        aria-live="polite"
        aria-relevant="additions text"
      ></ol>
      <div id="ai-chat-suggestions" class="ai-chat-suggestions" aria-label="추천 질문">
        <button type="button" data-question="어떤 일을 하고 있나요?">현재 하는 일</button>
        <button type="button" data-question="보유한 자격증을 알려주세요.">보유 자격증</button>
        <button type="button" data-question="연구와 수상 내용을 소개해 주세요.">연구와 수상</button>
        <button type="button" data-question="주요 프로젝트를 소개해 주세요.">주요 프로젝트</button>
      </div>
      <p id="ai-chat-status" class="ai-chat-status" role="status"></p>
      <form id="ai-chat-form" class="ai-chat-form">
        <label class="sr-only" for="ai-chat-input">질문 (최대 1,000자)</label>
        <textarea
          id="ai-chat-input"
          rows="2"
          maxlength="1000"
          placeholder="경력이나 연구에 대해 물어보세요"
          enterkeyhint="send"
        ></textarea>
        <button id="ai-chat-send" class="button primary" type="submit" disabled>보내기</button>
      </form>
      <p class="ai-chat-reference">
        AI 답변은 본문과 함께 확인해 주세요. <a href="#experience">경력</a> ·
        <a href="#certifications">자격</a> · <a href="#awards">수상</a>
      </p>
      <p class="ai-chat-notice">
        질문과 공개 이력은 답변 생성을 위해 AI 서비스에 전달됩니다. 대화는 이 창을 새로고침하면
        초기화됩니다.
      </p>
    </dialog>
  </body>
</html>
