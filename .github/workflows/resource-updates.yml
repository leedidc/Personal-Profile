name: Check official resource updates

on:
  schedule:
    - cron: '17 0 * * *' # 매일 09:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-updates.yml'
      - 'scripts/check_resource_updates.py'
      - 'scripts/resource_monitor_sources.py'
      - 'scripts/resource-monitor-requirements.txt'
      - 'data/resources.json'

permissions:
  contents: write

concurrency:
  group: official-resource-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'leedidc/Personal-Profile'
    # Windows 인증서 저장소가 기관 서버의 누락된 중간 인증서를 정상 검증하도록 합니다.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install monitor dependencies
        run: python -m pip install -r scripts/resource-monitor-requirements.txt
      - name: Test change detection
        run: python -m unittest discover -s tests -p 'test_resource_monitor.py'
      - name: Check official sources and file hashes
        run: python -u scripts/check_resource_updates.py
      - name: Save only the monitoring report
        run: |
          npx --yes prettier@3.6.2 --write data/resource-updates.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resource-updates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update official resource monitoring report'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Surface incomplete checks
        run: |
          python -c "import json,sys; report=json.load(open('data/resource-updates.json',encoding='utf-8')); sys.exit(0 if report['status']=='ok' else 'Some official sources could not be checked. See the report.')"
