<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Article</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f6f7f9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    #title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    #meta {
      font-size: 13px;
      color: #888;
      margin-bottom: 30px;
    }

    #content {
      font-size: 17px;
      line-height: 1.8;
      color: #333;
    }

    #content img {
      max-width: 100%;
      border-radius: 10px;
      margin: 20px 0;
    }

    #content h1, #content h2, #content h3 {
      margin-top: 30px;
      font-weight: 700;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #555;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      #title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="../html/article.html">← Back</a>

  <div id="title"></div>

  <div id="meta" id="date"></div>

  <div id="content"></div>

</div>

<script src="../js/article-view.js"></script>

</body>
</html>
